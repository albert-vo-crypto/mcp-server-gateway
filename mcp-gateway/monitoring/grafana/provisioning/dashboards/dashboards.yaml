apiVersion: 1

providers:
  - name: mcp-gateway
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    # The dashboard JSON is generated by add-security-panels.py and tracked in
    # git, so the file is the source of truth. With allowUiUpdates on, Grafana
    # only applies a file whose "version" exceeds the one already stored, so a
    # single Save in the UI silently strands every later edit to the file.
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
